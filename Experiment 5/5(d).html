
<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightyellow;
        }
        h1 {
            text-align: center;
            color: blue;
        }
        .box {
            width: 300px;
            height: 100px;
            /* Content */
            background-color: lightblue;
            /* Padding */
            padding: 20px;
            /* Border */
            border: 5px solid red;
            /* Margin */
            margin: 40px auto;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>CSS Box Model</h1>
    <div class="box">
        <h2>Content</h2>
        <p>This is the content area.</p>
    </div>
</body>
</html>
