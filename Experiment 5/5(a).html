
<!DOCTYPE html>
<html>
<head>
    <title>Different Ways of Referencing Colors in CSS</title>
    <style>
        h1 {
            color: blue;
        }
        .color1 {
            color: red;
        }
        .color2 {
            color: #008000;
        }
        .color3 {
            color: rgb(255, 165, 0);
        }
        .color4 {
            color: rgba(128, 0, 128, 0.8);
        }
        .color5 {
            color: hsl(240, 100%, 50%);
        }
        .color6 {
            color: hsla(0, 100%, 50%, 0.7);
        }
    </style>
</head>
<body>
    <h1>Different Ways of Referencing Colors in CSS</h1>
    <p class="color1">1. Color Name: Red</p>
    <p class="color2">2. Hexadecimal Color: #008000</p>
    <p class="color3">3. RGB Color: rgb(255, 165, 0)</p>
    <p class="color4">4. RGBA Color: rgba(128, 0, 128, 0.8)</p>
    <p class="color5">5. HSL Color: hsl(240, 100%, 50%)</p>
    <p class="color6">6. HSLA Color: hsla(0, 100%, 50%, 0.7)</p>
</body>
</html>
