
<!DOCTYPE html>
<html>
<head>
    <title>CSS Font and Text Properties</title>
    <style>
        h1 {
            text-align: center;
            color: blue;
        }
        .size {
            font-size: 25px;
        }
        .weight {
            font-weight: bold;
        }
        .style {
            font-style: italic;
        }
        .decoration {
            text-decoration: underline;
        }
        .transform {
            text-transform: uppercase;
        }
        .align {
            text-align: right;
        }
    </style>
</head>
<body>
    <h1>CSS Font and Text Properties</h1>
    <p class="size">This text demonstrates font-size.</p>
    <p class="weight">This text demonstrates font-weight.</p>
    <p class="style">This text demonstrates font-style.</p>
    <p class="decoration">This text demonstrates text-decoration.</p>
    <p class="transform">This text demonstrates text-transform.</p>
    <p class="align">This text demonstrates text-align.</p>
</body>
</html>
