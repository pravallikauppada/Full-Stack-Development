<!DOCTYPE html>
<html>

<head>
    <title>Types of CSS</title>

    <!-- Internal CSS -->
    <style>

        h1 {
            color: blue;
            text-align: center;
        }

        p {
            color: green;
            font-size: 20px;
        }

    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>Types of CSS</h1>

    <!-- Inline CSS -->
    <h2 style="color:red; text-align:center;">
        Inline CSS
    </h2>

    <p>
        This paragraph uses Internal CSS.
    </p>

    <h3>
        This heading uses External CSS.
    </h3>

</body>

</html>
