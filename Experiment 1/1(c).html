<!DOCTYPE html>
<html>
<head>
    <title>HTML Hyperlinks</title>
</head>

<body>

    <h1>HTML Hyperlinks</h1>

    <h2>Using href Attribute</h2>

    <a href="https://www.google.com">
        Open Google
    </a>

    <br><br>

    <a href="https://www.youtube.com">
        Open YouTube
    </a>

    <h2>Using target Attribute</h2>

    <p>Open in the same window:</p>

    <a href="https://www.wikipedia.org" target="_self">
        Open Wikipedia
    </a>

    <p>Open in a new window/tab:</p>

    <a href="https://www.instagram.com" target="_blank">
        Open Instagram
    </a>

</body>
</html>
